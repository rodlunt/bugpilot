name: Feature request
description: Suggest an improvement or new capability
labels: [enhancement]
body:
  - type: textarea
    id: ask
    attributes:
      label: What would you like?
      placeholder: Describe the feature or improvement.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why do you need it?
      placeholder: What problem does this solve?
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      description: Two or three testable criteria that show the feature is done. "Finished typing" isn't done; the criteria passing is.
      placeholder: |
        1. Given …, when …, then …
        2. …
    validations:
      required: true
