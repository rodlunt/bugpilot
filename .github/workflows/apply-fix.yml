name: bugpilot apply-fix

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number to fix'
        required: true
        type: string

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./actions/apply-fix
        with:
          issue-number: ${{ github.event.inputs.issue_number }}
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          anthropic-federation-rule-id: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          anthropic-organization-id: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          anthropic-service-account-id: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          ntfy-topic: ${{ secrets.NTFY_TOPIC }}
          ntfy-token: ${{ secrets.NTFY_TOKEN }}
