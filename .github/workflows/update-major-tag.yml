name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.1.2

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Generate SBOMs
        run: |
          set -e
          for pkg in widget actions/triage actions/apply-fix; do
            name=$(echo "$pkg" | tr '/' '-')
            echo "Generating CycloneDX SBOM for $pkg..."
            (cd "$pkg" && pnpm dlx @cyclonedx/cdxgen -t js -o "$GITHUB_WORKSPACE/bugpilot-${name}.cdx.json" .)
          done

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" --title "$TAG" --generate-notes \
            bugpilot-widget.cdx.json \
            bugpilot-actions-triage.cdx.json \
            bugpilot-actions-apply-fix.cdx.json

      - name: Move major version tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          MAJOR=$(echo "$TAG" | grep -oE '^v[0-9]+')
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "$MAJOR"
          git push origin "$MAJOR" --force
          echo "Moved $MAJOR → $TAG"
