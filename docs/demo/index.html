<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Acme Reports — bugpilot screenshot demo</title>
  <!--
    Fake host app used to capture the README screenshots, committed so
    recaptures are reproducible (the framing step is docs/frame_screenshots.py).

    Usage:
      1. cd widget && pnpm build          (the page loads the built IIFE)
      2. serve the repo root, e.g.:  python3 -m http.server 8790
      3. capture through a /reports/ symlink so the widget's URL-path context
         chip reads like a real app instead of /docs/demo/:
           ln -s docs/demo reports
      4. open http://localhost:8790/reports/?brand=%236366f1
         The brand query drives BOTH the fake app's accent and the widget's
         config.color, demonstrating that the widget takes its colour from
         the host. Omit ?brand to see the widget's grayscale default.

    Screenshot states (?state=) pre-stage the exact captures the README uses,
    so no browser scripting is needed:
      ?state=bug      opens the bug form, filled, and captures the screenshot
      ?state=feature  opens the feature form, filled
    Headless capture, one command per shot (then rm the symlink and run
    docs/frame_screenshots.py):
      google-chrome --headless=new --window-size=1488,960 \
        --force-device-scale-factor=2 --hide-scrollbars \
        --virtual-time-budget=8000 --screenshot=docs/images/screenshot-hero.png \
        'http://localhost:8790/reports/?brand=%236366f1'
  -->
  <style>
    :root { --brand: #6366f1; }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      background: #f6f8fa;
      color: #0f172a;
    }
    header {
      display: flex;
      align-items: center;
      gap: 28px;
      background: #fff;
      border-bottom: 1px solid #e2e8f0;
      padding: 18px 40px;
    }
    header h1 { font-size: 19px; margin: 0 12px 0 0; }
    header nav a {
      font-size: 15px;
      text-decoration: none;
      color: #94a3b8;
      margin-right: 22px;
    }
    header nav a.active { color: #0f172a; font-weight: 600; }
    main { padding: 36px 40px; }
    main h2 { font-size: 26px; margin: 0 0 6px; }
    .sub { color: #64748b; margin: 0 0 28px; }
    .table-card {
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      max-width: 1340px;
      overflow: hidden;
    }
    table { width: 100%; border-collapse: collapse; font-size: 15px; }
    th, td { text-align: left; padding: 15px 22px; }
    th { font-size: 13.5px; color: #475569; border-bottom: 1px solid #e2e8f0; }
    tr + tr td { border-top: 1px solid #eef2f6; }
    td.owner, td.updated { color: #64748b; }
    td a { color: var(--brand); text-decoration: none; }
  </style>
</head>
<body>
  <header>
    <h1>Acme Reports</h1>
    <nav>
      <a href="#" class="active">Reports</a>
      <a href="#">Schedules</a>
      <a href="#">Settings</a>
    </nav>
  </header>
  <main>
    <h2>Weekly reports</h2>
    <p class="sub">Last 30 days, filtered by team.</p>
    <div class="table-card">
      <table>
        <thead>
          <tr><th>Report</th><th>Owner</th><th>Updated</th><th>Export</th></tr>
        </thead>
        <tbody>
          <tr><td>Signups by channel</td><td class="owner">Ops team</td><td class="updated">2 days ago</td><td><a href="#">Export</a></td></tr>
          <tr><td>Retention cohort</td><td class="owner">Ops team</td><td class="updated">2 days ago</td><td><a href="#">Export</a></td></tr>
          <tr><td>Support ticket volume</td><td class="owner">Ops team</td><td class="updated">2 days ago</td><td><a href="#">Export</a></td></tr>
          <tr><td>Revenue by plan</td><td class="owner">Ops team</td><td class="updated">2 days ago</td><td><a href="#">Export</a></td></tr>
        </tbody>
      </table>
    </div>
  </main>

  <script src="../../widget/dist/bugpilot.iife.js"></script>
  <script>
    const params = new URLSearchParams(location.search)
    const brand = params.get('brand')
    if (brand) document.documentElement.style.setProperty('--brand', brand)
    BugPilot.init({
      endpoint: 'http://localhost:8787/feedback',
      projectName: 'Acme Reports',
      position: 'bottom-right',
      ...(brand ? { color: brand } : {}),
    })

    // Screenshot states: pre-stage the README captures (see header comment).
    const state = params.get('state')
    if (state === 'bug' || state === 'feature') {
      const fill = (sel, val) => {
        const el = document.querySelector(sel)
        el.value = val
        el.dispatchEvent(new Event('input', { bubbles: true }))
      }
      BugPilot.open()
      if (state === 'bug') {
        document.querySelector('#bp-bug-category').value = 'Functionality bug'
        fill('#bp-what-happened', 'Clicking Export on the reports page does nothing. No download starts and no error appears in the console.')
        fill('#bp-expected', "The report should download as a CSV file, same as it did before last week's deploy.")
        fill('#bp-steps', '1. Go to Reports\n2. Filter by last 30 days\n3. Click Export\n4. Nothing happens')
        document.querySelector('#bp-capture-btn').click()
        setTimeout(() => document.activeElement?.blur(), 2500)
      } else {
        document.querySelector('[data-type="feature"]').click()
        fill('#bp-feature-ask', 'Let me schedule a report to email itself to the team every Monday morning, instead of exporting it by hand each week.')
        fill('#bp-feature-why', 'Our ops stand-up runs off the signups report; whoever remembers exports it and pastes it into Slack.')
        document.querySelector('#bp-feature-priority').value = 'high'
        setTimeout(() => document.activeElement?.blur(), 300)
      }
    }
  </script>
</body>
</html>
